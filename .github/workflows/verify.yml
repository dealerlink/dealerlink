# Dealerlink CI — the merge gate.
#
# Established Stage F Day 22 (task F.33). Before this, the repo had NO CI at
# all: both `.do/app.yaml` and `.do/app.production.yaml` carry
# `deploy_on_push: true` on `main`, so every push to main deployed to staging
# AND production having run nothing but `next build`. Branch protection plus
# the status checks below is the only thing between an untested commit and
# production — see docs/RUNBOOKS.md, "Branch protection + CI status checks".
#
# Three jobs, fastest feedback first:
#   checks — typecheck / lint / build / plan:check. No database.
#   test   — the vitest suites (560).
#   e2e    — the `pnpm verify` Playwright chain (65). Gated on `checks`.
#
# Every DB-touching job gets its OWN EPHEMERAL Postgres service container,
# created and destroyed with the job. Nothing here ever touches the
# docker-compose database. A fresh DB per job is the point: half the flakiness
# of Days 19-21 was residue in a shared dev DB (the DEV.31 pattern, and the
# Day 20 case in DEV.91 where an earlier `pnpm test` left 66 quotation rows
# that pushed a seeded row off page 1 of a list). Because `test` and `e2e` run
# on separate runners against separate databases, that ordering hazard is
# removed structurally rather than by sequencing.
name: verify

on:
  pull_request:
    branches: [main]
  # A record, not a gate: `main` has already begun deploying by the time this
  # runs. The gate is the pull_request run.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ephemeral CI Postgres. These credentials mirror docker-compose.yml + the
  # committed packages/db/.env.test so migrations, the RLS role bootstrap
  # (packages/db/src/rls/00-app-role.sql) and the seeds all line up. They are
  # NOT secrets: the database exists for the lifetime of one job on a
  # throwaway runner. Host is `localhost` here, not the compose service name
  # `postgres`, because service-container ports are published to the runner.
  #
  # dotenv never overrides an already-set var, so these win over both
  # `.env.local` (absent in CI) and packages/db/.env.test.
  DATABASE_URL: postgresql://dealerlink_app:dev_app_password_change_me@localhost:5432/dealerlink_dev
  APP_DATABASE_URL: postgresql://dealerlink_app:dev_app_password_change_me@localhost:5432/dealerlink_dev
  DATABASE_DIRECT_URL: postgresql://dealerlink:dev_password_change_me@localhost:5432/dealerlink_dev
  # The CI web server is plain http://localhost, so auth cookies must not be
  # Secure or the browser drops the session and every spec fails at login.
  # Fail-safe default stays secure (lib/auth/cookie-security.ts, DEV.91).
  SESSION_COOKIE_SECURE: 'false'
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Throwaway TEST FIXTURE, not a secret — it signs and verifies fixtures the
  # suite generates for itself, and nothing in CI talks to Resend (with no
  # RESEND_API_KEY the worker logs the message instead of sending it).
  #
  # It MUST be `whsec_` + valid base64. `svix` base64-decodes the key in the
  # Webhook constructor, so a non-base64 value throws
  # "Base64Coder: incorrect characters for decoding" inside the suite's own
  # sign() helper (lib/email/resend-webhook.test.ts:46) BEFORE any assertion
  # runs — which is what turned the whole vitest job red on the first CI run.
  # This is base64 of 24 random bytes. Do not "simplify" it to a readable
  # string: underscores and hyphens are not valid base64.
  RESEND_INBOUND_WEBHOOK_SECRET: whsec_aTMoWyL4NfZWLrPBiF9JF9gNfJl34AA6
  RESEND_FROM_EMAIL: onboarding@resend.dev
  TZ: Asia/Kolkata

jobs:
  # ---------------------------------------------------------------------------
  # A — static gates. No database, no server, no browser. ~3-4 min.
  # ---------------------------------------------------------------------------
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheapest gate first — a drifted plan table costs 2s to catch, not 4 min.
      - name: plan:check
        run: pnpm plan:check

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      # The Next build cache. `next build` and `next dev` keep separate
      # subtrees under .next/cache, so this is safe to restore in either job.
      # Namespaced `next-` (production build) vs the e2e job's `next-dev-`.
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # No database: the @dealerlink/db client is a lazy proxy, so `next build`
      # never opens a connection. Verified locally against a dead port.
      - name: build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # B — vitest. Needs a migrated AND seeded database: packages/db integration
  # tests assert against the seeded `demo` / `sample` tenants and fail fast
  # with "seed tenants missing" otherwise. ~4-6 min.
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealerlink
          POSTGRES_PASSWORD: dev_password_change_me
          POSTGRES_DB: dealerlink_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealerlink -d dealerlink_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docker-compose mounts this into the image's initdb hook; a service
      # container has no such mount, so apply it explicitly. Same file, so the
      # extension set cannot drift from local.
      - name: Create extensions (scripts/init-db.sql)
        run: psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      # Also creates the dealerlink_app NOBYPASSRLS role and applies the RLS
      # policies + audit triggers (packages/db/src/migrate.ts).
      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      # The 26- and 500-serial dispatch notes are NOT in the seed — they are
      # built by this fixture, and two of the fourteen snapshot cases are them.
      # Without it the suite fails with "no dispatch DSP-REF-0026 for tenant
      # 'demo' — has the database been seeded?", which is the resolver reporting
      # exactly what is wrong.
      - name: Apply the long-serial fixture
        run: psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f apps/workers/scripts/long-serial-fixture.sql

      # Typst for the PDF snapshot tests. This replaces the Chromium runtime
      # libraries the workers' render specs used to need: one statically-linked
      # musl binary, no shared-library surface, nothing to apt-install.
      #
      # The installer pins the version AND verifies a sha256 per architecture,
      # and `typst:check` fails the job if the resolved binary is a different
      # version. That check is not ceremony: every reference PDF in
      # docs/pdf-references/ was rendered by the pinned build and those
      # references can no longer be regenerated, so a silent upgrade would
      # invalidate a baseline nothing can rebuild.
      # The install dir goes on PATH explicitly. The RENDERER resolves the
      # binary with `command -v typst` (src/pdf/typst.ts), so a runner whose
      # PATH happens not to include ~/.local/bin would install successfully and
      # then fail at render time — the worst ordering, because the install step
      # goes green.
      - name: Install Typst (pinned + checksum-verified)
        run: |
          pnpm typst:install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the pinned Typst version
        run: pnpm typst:check

      - name: vitest
        run: pnpm test

  # ---------------------------------------------------------------------------
  # B2 — Typst cross-architecture byte determinism, ON A REAL DOCUMENT (F.66).
  #
  # This job used to compile a synthetic fixture. That fixture had no timestamp
  # in it, so it could not have caught the defect Day 26 actually found:
  # `generatedAt: new Date()` in the shared loaders made every render of a real
  # document differ from the last, while the fixture sat green the whole time. A
  # check that cannot fail for the reason the system actually breaks is
  # decoration, so it now renders the 500-serial dispatch note — the heaviest and
  # only multi-page document in the corpus — and compares its sha256 against a
  # hash recorded on the arm64 devcontainer.
  #
  # It costs a database now, which the fixture did not. That is the price of
  # testing the thing rather than a proxy for it.
  # ---------------------------------------------------------------------------
  typst-determinism:
    name: typst-determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealerlink
          POSTGRES_PASSWORD: dev_password_change_me
          POSTGRES_DB: dealerlink_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealerlink -d dealerlink_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned by version AND sha256, per architecture. Not ceremony: every
      # reference PDF was rendered by this build and none of them can be
      # regenerated, so a silent upgrade would invalidate a baseline nothing can
      # rebuild.
      # The install dir goes on PATH explicitly. The RENDERER resolves the
      # binary with `command -v typst` (src/pdf/typst.ts), so a runner whose
      # PATH happens not to include ~/.local/bin would install successfully and
      # then fail at render time — the worst ordering, because the install step
      # goes green.
      - name: Install Typst (pinned + checksum-verified)
        run: |
          pnpm typst:install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the pinned Typst version
        run: pnpm typst:check

      - name: Create extensions (scripts/init-db.sql)
        run: psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      - name: Migrate
        run: pnpm db:migrate

      # The seed clock is pinned (F.67), which is what makes a rendered document
      # reproducible at all. The long-serial fixture is not part of the seed.
      - name: Seed
        run: pnpm db:seed
      - name: Apply the long-serial fixture
        run: psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f apps/workers/scripts/long-serial-fixture.sql

      - name: Render a real document and compare bytes against the arm64 hash
        working-directory: apps/workers
        run: pnpm exec tsx scripts/determinism-check.ts

  # ---------------------------------------------------------------------------
  # C — the verify chain. Gated on `checks` so a typo does not cost ten
  # minutes of Playwright. ~10-15 min.
  #
  # Runs against `next dev`, exactly as local does. NOT `next start`: under
  # NODE_ENV=production the session-cookie domain and the operator subdomain
  # routing both switch to the production apex, which a localhost browser
  # rejects (DEV.91 §3.1). Decoupling that from NODE_ENV is task F.31 and is
  # deliberately not done here.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # DEV.104 / F.52 — 30 -> 40, ABOVE playwright.config.ts's globalTimeout
    # (25 min). The two caps were inverted: globalTimeout was 40 and this was
    # 30, so on a genuine hang GitHub killed the job first, Playwright's onEnd
    # never ran, and test-results/verify-results.json — the artifact DEV.81
    # exists to preserve — was never written. It failed in exactly the case it
    # was built for. Playwright's cap must fire first and this one is the
    # backstop, so the ordering is now globalTimeout 25 < timeout-minutes 40.
    # The gap covers this job's non-Playwright work: ~1 min of install /
    # browser install / migrate / seed before `verify`, plus the failure-path
    # artifact uploads that only run after Playwright exits. Do not lower this
    # below globalTimeout + a few minutes without changing globalTimeout too —
    # the two numbers are a pair.
    timeout-minutes: 40
    needs: checks

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealerlink
          POSTGRES_PASSWORD: dev_password_change_me
          POSTGRES_DB: dealerlink_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealerlink -d dealerlink_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Run unconditionally, cache hit or miss. `install` is close to a no-op
      # when the browser is already on disk, and making it conditional is
      # exactly how a stale cache turns into a confusing "Executable doesn't
      # exist" failure. --with-deps covers the browser's shared libraries.
      # (It used to be load-bearing for the workers' PDF specs too; those render
      # through Typst now and need no browser at all.)
      - name: Install Playwright Chromium + system deps
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Create extensions (scripts/init-db.sql)
        run: psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      - name: Migrate
        run: pnpm db:migrate

      # Seed is the LAST database step before verify. Every day-spec asserts
      # against a known seeded state (playwright.config.ts runs workers: 1,
      # fullyParallel: false for that reason), so verify must see a freshly
      # seeded database — never one an earlier suite has written to. This job
      # runs no vitest at all, so nothing can pollute it.
      - name: Seed
        run: pnpm db:seed

      # THE WORKERS PROCESS RENDERS PDFS DURING THIS SUITE. `pnpm verify` boots
      # web AND workers, and the Day 10/14 specs click through to a real PDF
      # download, so the render path runs for real here — it just runs behind a
      # queue instead of in the test process.
      #
      # Without this the download specs time out at 55s waiting for an event
      # that can never arrive, because the job resolving the render throws
      # "typst binary not found". That is a slow and indirect way to learn the
      # binary is missing, which is precisely why it belongs here.
      # The install dir goes on PATH explicitly. The RENDERER resolves the
      # binary with `command -v typst` (src/pdf/typst.ts), so a runner whose
      # PATH happens not to include ~/.local/bin would install successfully and
      # then fail at render time — the worst ordering, because the install step
      # goes green.
      - name: Install Typst (pinned + checksum-verified)
        run: |
          pnpm typst:install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the pinned Typst version
        run: pnpm typst:check

      # A SEPARATE key namespace from the `checks` job. Both write
      # apps/web/.next/cache, but `checks` fills it with a production build and
      # this job with `next dev` chunks — sharing one key would make the two
      # jobs collide on save and cache the wrong artefacts for each other.
      # Warming it is what keeps first-hit route compilation (5-10s per route)
      # off the critical path on repeat runs.
      - name: Restore Next dev cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-dev-${{ runner.os }}-

      # Boots `next dev` + the workers process itself (playwright.config.ts
      # webServer) and runs plan:check first.
      - name: verify
        run: pnpm verify

      # The whole value of CI is diagnosing what cannot be reproduced locally.
      # trace: 'retain-on-failure' and screenshot: 'only-on-failure' are already
      # set in playwright.config.ts; both land under test-results/.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces + screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
